name: scolar_mobile
description: "Application mobile Scolar."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Design / typographie
  google_fonts: 8.1.0
  flutter_svg: ^2.0.10+1

  # Navigation
  go_router: ^14.6.2

  # State management
  flutter_riverpod: ^2.6.1

  # Stockage local
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4

  # Mises à jour applicatives
  in_app_update: ^4.2.3
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1

  # HTTP
  dio: ^5.7.0

  # i18n
  intl: ^0.20.2

  # Monitoring
  sentry_flutter: ^8.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Splash natif
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/onboarding/

# ──────────────────────────────────────────────────────────────────────────
# Splash natif — config consommée par `flutter pub run flutter_native_splash:create`
# ──────────────────────────────────────────────────────────────────────────
flutter_native_splash:
  color: "#0D02FE"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#0D02FE"
    image: assets/branding/splash_logo.png
  ios: true
  android: true
  web: false
