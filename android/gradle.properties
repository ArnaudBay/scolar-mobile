org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Désactive le cache incrémental Kotlin — incompatible avec un Pub cache
# (C:\Users\…\Pub\Cache\) sur un autre disque que le projet (D:\…). Le
# RelocatableFileToPathConverter throw IllegalArgumentException et corrompt
# le build. Le coût en temps de build est mineur (≈ +10 %) vs rebuild from
# scratch après chaque échec.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

# Build en parallèle (gain de temps sur multi-cœurs)
org.gradle.parallel=true
org.gradle.caching=true
